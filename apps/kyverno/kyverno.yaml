apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.2.7
    helm:
      valuesObject:
        admissionController:
          replicas: 1
        crds:
          install: true
        cleanupController:
        rbac:
          clusterRole:
            enabled: true
      cleanupJobs:
        image:
          registry: docker.io
          repository: bitnami/kubectl
          tag: "1.29.3"
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true